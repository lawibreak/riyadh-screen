<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Riyadh Screen</title>
<style>html,body{margin:0;height:100%;background:#07090d;cursor:none}</style>
</head>
<body>
<script>
// Cloud loader: shows the latest Riyadh Screen from GitHub (main branch),
// so changes pushed there reach the TV without reinstalling the app.
// If the TV is offline or GitHub is down, falls back to the copy bundled in the app.
(function () {
  var LIVE = 'https://raw.githubusercontent.com/lawibreak/riyadh-screen/main/index.html';
  var REFRESH_MS = 6 * 60 * 60 * 1000; // pick up new versions every 6 hours
  var done = false;

  function fallback() {
    if (done) return;
    done = true;
    location.replace('app.html');
  }

  function show(html) {
    if (done) return;
    done = true;
    var reload = '<script>setTimeout(function(){location.replace(' +
      JSON.stringify(location.href.split('#')[0]) + ')},' + REFRESH_MS + ')<\/script>';
    html = html.indexOf('</body>') >= 0 ? html.replace('</body>', reload + '</body>') : html + reload;
    document.open();
    document.write(html);
    document.close();
  }

  var x = new XMLHttpRequest();
  x.open('GET', LIVE + '?t=' + Date.now(), true);
  x.timeout = 15000;
  x.onload = function () {
    var ok = x.status === 200 && x.responseText.indexOf('<html') >= 0;
    ok ? show(x.responseText) : fallback();
  };
  x.onerror = x.ontimeout = fallback;
  setTimeout(fallback, 20000);
  x.send();
})();
</script>
</body>
</html>
