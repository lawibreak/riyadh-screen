name: Renew LG Developer Mode

# Keeps the TV's Developer Mode session (and the Riyadh Screen app) from expiring.
on:
  schedule:
    - cron: "17 3 * * 1"   # every Monday 03:17 UTC (06:17 Riyadh)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Renew the TV's Developer Mode session
        env:
          TOKEN: ${{ secrets.LG_DEVMODE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::Add the LG_DEVMODE_TOKEN secret first"; exit 1; fi
          renew=$(curl -s -m 30 "https://developer.lge.com/secure/ResetDevModeSession.dev?sessionToken=$TOKEN")
          check=$(curl -s -m 30 "https://developer.lge.com/secure/CheckDevModeSession.dev?sessionToken=$TOKEN")
          echo "renew: $renew"
          echo "check: $check"
          echo "$renew" | grep -q '"result":"success"' || { echo "::error::LG did not accept the renewal"; exit 1; }
          left=$(echo "$check" | sed -n 's/.*"errorMsg":"\([^"]*\)".*/\1/p')
          echo "Time left: $left"
          echo "LEFT=$left" >> "$GITHUB_ENV"

      # GitHub pauses scheduled workflows in public repos after 60 days without
      # activity, so each run records the renewal in a small file.
      - uses: actions/checkout@v4
      - name: Record the renewal
        run: |
          echo "Last renewed $(date -u +'%Y-%m-%d %H:%M UTC'), $LEFT hours left" > devmode-renewal.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add devmode-renewal.txt
          git commit -m "Record Developer Mode renewal" && git push
